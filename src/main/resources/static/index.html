<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>📚 Book Library</h1>
  <a href="index.html" class="active">Books</a>
  <a href="authors.html">Authors</a>
</header>

<main>
  <div class="bar">
    <input id="qTitle" placeholder="Book title">
    <input id="qAuthor" placeholder="Author name">
    <input id="qPrice" inputmode="decimal" placeholder="Price" style="width:110px">
    <input id="qId" inputmode="numeric" placeholder="ID" style="width:80px">
    <select id="sort">
      <option value="">Sort by</option>
      <option value="title,asc">Title (A-Z)</option>
      <option value="title,desc">Title (Z-A)</option>
      <option value="price,asc">Price: low to high</option>
      <option value="price,desc">Price: high to low</option>
    </select>
    <button id="btnSearch">Search</button>
    <button id="btnReset" class="ghost">Reset</button>
    <span class="grow"></span>
    <button id="btnNew">+ New book</button>
  </div>

  <div id="list" class="grid"></div>
  <div id="pager" class="pager"></div>
</main>

<dialog id="dlg">
    <h2 id="dlgTitle" style="margin-top:0"></h2>

    <div class="step">
        <p class="q">Is your book second-hand or first-hand?</p>
        <div id="typeBtns" class="choices">
            <button type="button" data-v="first">First-hand</button>
            <button type="button" data-v="second">Second-hand</button>
        </div>
    </div>

    <div id="stepCond" class="step" hidden>
        <p class="q">What's your book condition?</p>
        <div id="condBtns" class="choices">
            <button type="button" data-v="NEW">New</button>
            <button type="button" data-v="FAIR">Fair</button>
            <button type="button" data-v="POOR">Poor</button>
        </div>
    </div>

    <div id="fields" hidden>
        <label>Book title</label>
        <input id="fTitle">
        <label>Price</label>
        <input id="fPrice" inputmode="decimal">
        <label>Author</label>
        <div class="ac">
            <input id="fAuthor" placeholder="Start typing the author name" autocomplete="off">
            <div id="acList" class="ac-list" hidden></div>
        </div>
    </div>

    <div class="row">
        <button id="btnCancel" class="ghost">Cancel</button>
        <button id="btnSave">Save</button>
    </div>
</dialog>

<dialog id="confirmDlg">
  <h2 style="margin-top:0">Are you sure?</h2>
  <p>This book will be deleted.</p>
  <div class="row">
    <button id="btnNo" class="ghost">No</button>
    <button id="btnYes" class="danger">Yes</button>
  </div>
</dialog>

<script src="common.js"></script>
<script>
  const SIZE = 5; // 5 books per page
  let page = 0;
  let editId = null;

  let authors = [];
  let selectedAuthor = null;

  async function loadAuthors() {
    authors = await api("/authors");
  }

  function showSuggestions() {
    const q = $("fAuthor").value.trim().toLowerCase();
    const found = authors.filter((a) => fullName(a).toLowerCase().includes(q)).slice(0, 8);
    const box = $("acList");
    box.innerHTML = found.length
            ? found.map((a) => `<div data-id="${a.id}">${esc(fullName(a))}</div>`).join("")
            : '<div class="none">No matching author</div>';
    box.hidden = false;
  }

  $("fAuthor").addEventListener("input", () => { selectedAuthor = null; showSuggestions(); });
  $("fAuthor").addEventListener("focus", showSuggestions);
  $("fAuthor").addEventListener("blur", () => setTimeout(() => ($("acList").hidden = true), 150));
  $("acList").addEventListener("mousedown", (e) => {
    const item = e.target.closest("[data-id]");
    if (!item) return;
    selectedAuthor = authors.find((a) => String(a.id) === item.dataset.id);
    $("fAuthor").value = fullName(selectedAuthor);
    $("acList").hidden = true;
  });

  async function loadBooks() {
    const p = new URLSearchParams({ page, size: SIZE });
    const map = { title: "qTitle", authorName: "qAuthor", price: "qPrice", id: "qId" };
    for (const [param, el] of Object.entries(map)) {
      const v = $(el).value.trim();
      if (v) p.set(param, v);
    }
    if ($("sort").value) p.set("sort", $("sort").value);

    try {
      const data = await api("/books?" + p);
      renderBooks(data.content);
      renderPager(data.number, data.totalPages);
    } catch (e) {
      toast(e.message, true);
    }
  }
  const COND = { NEW: "New", FAIR: "Fair", POOR: "Poor" };

  function badges(b) {
      if (!b.secondHand) return '<span class="badge">First-hand</span>';
      const c = COND[b.condition] ? `<span class="badge cond">Condition: ${COND[b.condition]}</span>` : "";
      return `<span class="badge used">Second-hand</span>${c}`;
  }
  function renderBooks(books) {
    if (!books.length) {
      $("list").innerHTML = '<div class="empty" style="grid-column:1/-1">No books found</div>';
      return;
    }
    $("list").innerHTML = books.map((b) => {
      const hue = ((b.booksId ?? 0) * 47) % 360;
      const a = b.authorId;
      return `
    <div class="card">
      <div class="cover" style="background:linear-gradient(135deg,hsl(${hue} 60% 48%),hsl(${(hue + 40) % 360} 60% 30%))">
        <span class="id">ID: ${esc(b.booksId)}</span>${esc((b.title || "?")[0].toUpperCase())}
      </div>
      <div class="body">
                <h3>${esc(b.title)}</h3>
        <div class="badges">${badges(b)}</div>
        <div class="price">${esc(b.price)} ₼</div>
        <a class="author" href="authors.html?id=${esc(a?.id)}"> ${esc(fullName(a))}</a>
      </div>
      <div class="actions">
        <button class="ghost" onclick='openForm(${JSON.stringify(b)})'>Edit</button>
        <button class="danger" onclick="removeBook(${b.booksId})">Delete</button>
      </div>
    </div>`;
    }).join("");
  }

  function renderPager(current, total) {
    if (total <= 1) { $("pager").innerHTML = ""; return; }
    let html = `<button ${current === 0 ? "disabled" : ""} onclick="go(${current - 1})">‹</button>`;
    for (let i = 0; i < total; i++) {
      html += `<button class="${i === current ? "cur" : ""}" onclick="go(${i})">${i + 1}</button>`;
    }
    html += `<button ${current >= total - 1 ? "disabled" : ""} onclick="go(${current + 1})">›</button>`;
    $("pager").innerHTML = html;
  }

  function go(p) { page = p; loadBooks(); }

  function openForm(book) {
      let isSecond = null;
      let cond = null;

      function renderWizard() {
          $("typeBtns").querySelectorAll("button").forEach((b) =>
              b.classList.toggle("sel", isSecond !== null && b.dataset.v === (isSecond ? "second" : "first")));
          $("condBtns").querySelectorAll("button").forEach((b) =>
              b.classList.toggle("sel", b.dataset.v === cond));
          $("stepCond").hidden = isSecond !== true;
          const ready = isSecond === false || (isSecond === true && cond !== null);
          $("fields").hidden = !ready;
          $("btnSave").disabled = !ready;
      }

      $("typeBtns").addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          isSecond = b.dataset.v === "second";
          if (!isSecond) cond = null;
          renderWizard();
      });

      $("condBtns").addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          cond = b.dataset.v;
          renderWizard();
      });

      function openForm(book) {
          editId = book ? book.booksId : null;
          $("dlgTitle").textContent = book ? "Edit book" : "New book";
          $("fTitle").value = book ? book.title : "";
          $("fPrice").value = book ? book.price : "";
          selectedAuthor = book && book.authorId ? book.authorId : null;
          $("fAuthor").value = selectedAuthor ? fullName(selectedAuthor) : "";
          $("acList").hidden = true;
          isSecond = book ? !!book.secondHand : null;
          cond = book && book.secondHand ? book.condition : null;
          renderWizard();
          $("dlg").showModal();
      }
  }

  async function save() {
      const title = $("fTitle").value.trim();
      const priceText = $("fPrice").value.trim().replace(",", ".");
      const price = parseFloat(priceText);

      if (isSecond === null) { toast("Please choose first-hand or second-hand", true); return; }
      if (isSecond && !cond) { toast("Please choose the book condition", true); return; }
      if (!title && !priceText) { toast("Please enter a title and a price", true); return; }
      if (!title) { toast("Please enter a title", true); return; }
      if (!priceText || isNaN(price)) { toast("Please enter a valid price", true); return; }

      const typed = $("fAuthor").value.trim().toLowerCase();
      const author = selectedAuthor || authors.find((a) => fullName(a).toLowerCase() === typed);
      if (!author) { toast("Please choose an author from the list", true); return; }

      const body = {
          title,
          price,
          secondHand: isSecond,
          condition: isSecond ? cond : null,
          authorId: { id: author.id },
      };
      try {
          if (editId !== null) {
              body.booksId = editId;
              await api("/books", { method: "PUT", body: JSON.stringify(body) });
              toast("Book updated");
          } else {
              await api("/books", { method: "POST", body: JSON.stringify(body) });
              toast("Book added");
          }
          $("dlg").close();
          loadBooks();
      } catch (e) {
          toast(e.message, true);
      }
  }

  let deleteId = null;

  function removeBook(id) {
    deleteId = id;
    $("confirmDlg").showModal();
  }

  async function confirmDelete() {
    $("confirmDlg").close();
    try {
      await api("/books?id=" + deleteId, { method: "DELETE" });
      toast("Book deleted");
      loadBooks();
    } catch (e) {
      toast(e.message, true);
    }
  }

  $("btnSearch").onclick = () => { page = 0; loadBooks(); };
  $("btnReset").onclick = () => {
    ["qTitle", "qAuthor", "qPrice", "qId", "sort"].forEach((i) => ($(i).value = ""));
    page = 0; loadBooks();
  };
  $("btnNew").onclick = () => openForm(null);
  $("btnCancel").onclick = () => $("dlg").close();
  $("btnSave").onclick = save;
  $("btnYes").onclick = confirmDelete;
  $("btnNo").onclick = () => $("confirmDlg").close();
  ["qTitle", "qAuthor", "qPrice", "qId"].forEach((i) =>
          $(i).addEventListener("keydown", (e) => { if (e.key === "Enter") $("btnSearch").click(); })
  );

  // When coming from the author page via "See this author's books"
  const urlAuthor = new URLSearchParams(location.search).get("authorName");
  if (urlAuthor) $("qAuthor").value = urlAuthor;

  // Only digits (and one dot for the price) are allowed in these fields
  $("qId").addEventListener("input", (e) => (e.target.value = e.target.value.replace(/\D/g, "")));
  ["qPrice", "fPrice"].forEach((i) =>
          $(i).addEventListener("input", (e) => {
              e.target.value = e.target.value.replace(",", ".").replace(/[^0-9.]/g, "").replace(/(\..*)\./g, "$1");          })
  );

  loadAuthors().catch((e) => toast("Authors failed to load: " + e.message, true));
  loadBooks();
</script>
</body>
</html>
